name: Bash installer
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
      - run: shellcheck -x scripts/*.sh tests/*.sh
      - run: sudo bash tests/unit.sh
      - run: bash tests/client-unit.sh
      - run: bash tests/hardening-unit.sh
      - run: python3 -B tests/client_profiles_test.py
      - run: python3 -B tests/reality_profiles_test.py
      - run: bash tests/maintenance-unit.sh
      - run: python3 -B tests/profile_check_test.py
      - run: python3 -B tests/fetch_test.py
      - run: bash tests/handoff-unit.sh
  mac-client:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Obtain the reviewed core only for CI configuration checks
        shell: bash
        run: |
          set -euo pipefail
          record=examples/1.14.2/client-versions.json
          version=$(jq -er '.core.version' "$record")
          name="sing-box-${version}-darwin-arm64.tar.gz"
          stage=$(mktemp -d "$RUNNER_TEMP/reviewed-core.XXXXXXXX")
          size=$(jq -er --arg n "$name" '.artifacts[$n].archive_size' "$record")
          digest=$(jq -er --arg n "$name" '.artifacts[$n].archive_sha256' "$record")
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 180 --max-filesize "$size" \
            "https://github.com/SagerNet/sing-box/releases/download/v${version}/${name}" -o "$stage/core.tar.gz"
          test "$(stat -f %z "$stage/core.tar.gz")" = "$size"
          printf '%s  %s\n' "$digest" "$stage/core.tar.gz" | shasum -a 256 -c -
          tar -xzf "$stage/core.tar.gz" -C "$stage" "sing-box-${version}-darwin-arm64/sing-box"
          core="$stage/sing-box-${version}-darwin-arm64/sing-box"
          test -f "$core" && test ! -L "$core"
          test "$(stat -f %z "$core")" = "$(jq -er --arg n "$name" '.artifacts[$n].binary_size' "$record")"
          printf '%s  %s\n' "$(jq -er --arg n "$name" '.artifacts[$n].binary_sha256' "$record")" "$core" | shasum -a 256 -c -
          printf 'REVIEWED_CORE=%s\n' "$core" >> "$GITHUB_ENV"
      - name: Check the exact reviewed core without starting TUN
        run: python3 -B tests/check_client_profiles.py --binary "$REVIEWED_CORE" --mode reviewed
      - run: brew update && brew install --formula bash curl jq openssl sing-box && brew upgrade --formula --no-ask bash curl jq openssl sing-box
      - run: /opt/homebrew/bin/bash -n scripts/connect-vps.sh
      - run: /opt/homebrew/bin/bash tests/client-unit.sh
      - run: python3 -B tests/fetch_test.py
      - name: Check current Homebrew stable compatibility without starting TUN
        run: python3 -B tests/check_client_profiles.py --binary /opt/homebrew/bin/sing-box --mode compatibility
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: client-profiles
          path: artifacts/client-profiles/
          if-no-files-found: warn
          retention-days: 14
  vm:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install test-only virtualization tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Install and test SS2022 in a disposable 1 GiB / 20 GiB VM
        run: sudo python3 -B tests/run_vm.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: simple-vm-result
          path: artifacts/simple-vm/
          if-no-files-found: warn
          retention-days: 14
  hardening-vm:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - ssh-mode: socket
            scenario: standard
            artifact: hardening-vm-socket
          - ssh-mode: service
            scenario: standard
            artifact: hardening-vm-service
          - ssh-mode: socket
            scenario: without-ufw
            artifact: hardening-vm-socket-without-ufw
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install disposable VM test tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      - name: Test separate preparation and hardening with fresh SSH sessions
        run: sudo python3 -B tests/run_hardening_vm.py --ssh-mode '${{ matrix.ssh-mode }}' --scenario '${{ matrix.scenario }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}/
          if-no-files-found: warn
          retention-days: 14
  deployment-vm:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install disposable full-deployment test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils jq curl openssl netcat-openbsd lsof
      - name: Clean VM prepare, fresh SSH, harden, install, private fetch, import, HTTPS, repeat and reboot
        run: sudo python3 -B tests/run_deployment_vm.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployment-vm
          path: artifacts/deployment-vm/
          if-no-files-found: warn
          retention-days: 14
